name: Verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:packages
      - run: npm run build:web
      - run: npm run zip
      - name: Install browser test tooling
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Verify actual package archives
        run: |
          mkdir -p artifacts/packages
          npm pack ./packages/core --ignore-scripts --pack-destination artifacts/packages
          npm pack ./packages/ui --ignore-scripts --pack-destination artifacts/packages
          node scripts/check-packages.mjs
      - name: Verify release archives and entry styles
        run: |
          python3 scripts/check-build-styles.py
          python3 scripts/check-release.py
      - name: Test the extension in an isolated Chrome profile
        run: |
          python3 scripts/check-extension.py
          python3 scripts/check-permissions.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myriad-release
          if-no-files-found: error
          include-hidden-files: true
          path: |
            apps/extension/.output/myriad-*-chrome.zip
            apps/extension/.output/myriad-*-firefox.zip
            apps/extension/.output/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified files and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" -n myriad-release -D release
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS --verify-tag --title "万象 $RELEASE_TAG" --generate-notes
